appId: com.frameflow.desktop
productName: FrameFlow
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - '**/*.wasm'
npmRebuild: false
extraResources:
  - from: resources/media
    to: media
    filter:
      - '${os}-${arch}/**/*'
  - from: resources/cli-proxy/${os}-${arch}
    to: cli-proxy
    filter:
      - '**/*'
  - from: resources/proxy-supervisor.cjs
    to: proxy-supervisor.cjs
win:
  executableName: FrameFlow
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: false
nsis:
  artifactName: FrameFlow-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
